spring.application.name=notebook-clone
# MySQL 数据库连接配置 (请把密码改成你自己的本机 MySQL 密码！)
spring.datasource.url=jdbc:mysql://localhost:3306/notebook_clone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

# JPA 魔法配置：update 表示每次启动如果发现表不存在就自动创建，如果表结构变了就自动更新
spring.jpa.hibernate.ddl-auto=update
# 在控制台打印出自动生成的 SQL 语句，方便我们学习和观察
spring.jpa.show-sql=true